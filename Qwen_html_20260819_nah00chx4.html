<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МемоСбор - {{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; padding-bottom: 40px; }
        .hint-box { 
            background: rgba(255, 193, 7, 0.1); 
            border-left: 4px solid #ffc107; 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .card-header { font-weight: bold; }
    </style>
</head>
<body class="container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🚀 МемоСбор</a>
            <div class="navbar-nav ms-auto flex-row gap-3">
                <a class="nav-link" href="/">Галерея</a>
                <a class="nav-link" href="/settings">⚙️ Настройки API</a>
                <a class="nav-link text-muted" href="#">Логи</a>
            </div>
        </div>
    </nav>
    
    {% if saved %}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
        ✅ Настройки успешно сохранены в config.yaml!
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
