<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Модерация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.meme-card { cursor: pointer; transition: transform 0.2s; } .meme-card:hover { transform: scale(1.02); }</style>
</head>
<body class="bg-dark text-white">
<div class="container-fluid mt-3">
    <h2>Модерация <small class="text-muted">(Стрелки ← →, Enter, Backspace)</small></h2>
    <div class="btn-group mb-3">
        <a href="/memos?status=new" class="btn {{ 'btn-primary' if current_status=='new' else 'btn-outline-primary' }}">Новые</a>
        <a href="/memos?status=approved" class="btn {{ 'btn-success' if current_status=='approved' else 'btn-outline-success' }}">Одобренные</a>
    </div>
    
    <div id="gallery" class="row">
        {% for meme in memes %}
        <div class="col-md-2 mb-3 meme-item" data-id="{{ meme.id }}">
            <div class="card bg-secondary text-white meme-card" onclick="selectMeme(this)">
                <img src="{{ meme.file_path }}" class="card-img-top" style="height: 150px; object-fit: cover;">
                <div class="card-body p-1 text-center">
                    <small>{{ meme.source }}</small>
                </div>
            </div>
            <div class="d-grid gap-1 mt-1">
                <button class="btn btn-sm btn-success" onclick="action({{ meme.id }}, 'approve')">✓</button>
                <button class="btn btn-sm btn-danger" onclick="action({{ meme.id }}, 'reject')">✗</button>
                {% if current_status == 'approved' %}
                <button class="btn btn-sm btn-info" onclick="compress({{ meme.id }})">Сжать</button>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
let currentIndex = -1;
const items = document.querySelectorAll('.meme-item');

function selectMeme(el) {
    items.forEach(i => i.querySelector('.card').classList.remove('border-light'));
    el.querySelector('.card').classList.add('border-light');
    currentIndex = Array.from(items).indexOf(el);
}

async function action(id, type) {
    await fetch(`/${type}/${id}`, {method: 'POST'});
    document.querySelector(`.meme-item[data-id="${id}"]`).remove();
}

async function compress(id) {
    const res = await fetch(`/compress/${id}`, {method: 'POST'});
    if(res.ok) alert('Сжато!');
}

document.addEventListener('keydown', e => {
    if (currentIndex === -1 && items.length > 0) selectMeme(items[0]);
    if (e.key === 'ArrowRight' && currentIndex < items.length - 1) selectMeme(items[++currentIndex]);
    if (e.key === 'ArrowLeft' && currentIndex > 0) selectMeme(items[--currentIndex]);
    if (e.key === 'Enter' && currentIndex !== -1) action(items[currentIndex].dataset.id, 'approve');
    if (e.key === 'Backspace' && currentIndex !== -1) action(items[currentIndex].dataset.id, 'reject');
});
</script>
</body>
</html>
