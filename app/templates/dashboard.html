<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>МемоСбор - Дашборд</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<div class="container mt-5">
    <h1>🚀 МемоСбор</h1>
    <div class="btn-group mb-4">
        <a href="/collect" class="btn btn-primary" onclick="startCollect(event)">Собрать сейчас</a>
        <a href="/memos" class="btn btn-warning">Модерация</a>
        <a href="/logs" class="btn btn-info">Логи</a>
        <button class="btn btn-success" onclick="sendMail()">Отправить подборку</button>
    </div>
    <div id="status" class="alert alert-secondary">Ожидание...</div>
    
    <h3>Последние мемы</h3>
    <div class="row">
        {% for meme in memes %}
        <div class="col-md-3 mb-3">
            <div class="card bg-secondary text-white">
                <img src="{{ meme.file_path }}" class="card-img-top" alt="Meme">
                <div class="card-body">
                    <p class="card-text">{{ meme.text[:30] }}...</p>
                    <span class="badge {{ 'bg-success' if meme.status=='approved' else 'bg-warning' }}">{{ meme.status }}</span>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
async function startCollect(e) {
    e.preventDefault();
    document.getElementById('status').innerText = "Запуск сбора...";
    const res = await fetch('/collect', {method: 'POST'});
    const data = await res.json();
    document.getElementById('status').innerText = data.message;
}
async function sendMail() {
    const res = await fetch('/send-mail', {method: 'POST'});
    const data = await res.json();
    alert(data.status === 'sent' ? 'Отправлено!' : 'Ошибка или пусто');
}
</script>
</body>
</html>
