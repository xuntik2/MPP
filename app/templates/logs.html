<!DOCTYPE html>
<html lang="ru">
<head><title>Логи</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-white p-4">
<h2>История запусков</h2>
<table class="table table-dark table-striped">
    <thead><tr><th>Время</th><th>Источник</th><th>Найдено</th><th>Сохранено</th><th>Ошибки</th></tr></thead>
    <tbody>
    {% for log in logs %}
        <tr>
            <td>{{ log.started_at }}</td>
            <td>{{ log.source }}</td>
            <td>{{ log.found }}</td>
            <td>{{ log.saved }}</td>
            <td class="text-danger">{{ log.error }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
<a href="/" class="btn btn-secondary">Назад</a>
</body>
</html>
